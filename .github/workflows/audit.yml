name: Security Audit
on:
  push: { branches: [main] }
  schedule: [{ cron: "0 3 * * *" }]
  workflow_dispatch:
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: |
          docker run --rm -v ${{ github.workspace }}:/scan zricethezav/gitleaks:latest scan --source="/scan" --redact
      - name: CodeQL
        uses: github/codeql-action/analyze@v3
